services:
  backend:
    build: ./app
    ports:
      - "8000:8000" #host port : container port
    environment:
      WEB_CONCURRENCY: 4 #define variable 
  web:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # host address : container address : read-only /// do bind mount